<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel - Hospital EsSalud Norte Chico</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>

    <header>
        <div class="logo">Hospital ESSALUD Norte Chico</div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="panel.html">Panel</a></li>
                <li><a href="login.html" id="btn-salir">Cerrar sesión</a></li>
            </ul>
        </nav>
    </header>

  <div class="cita-container">
    <h2 id="titulo-form">Registrar cita (atención presencial)</h2>
    <form id="formPanel">
      <div class="form-group">
        <label for="numeroAsegurado">Número de asegurado</label>
        <input type="text" id="numeroAsegurado" required maxlength="4" inputmode="numeric" pattern="[0-9]{4}" title="4 dígitos">
      </div>
      <div class="form-group">
        <label for="nombrePaciente">Nombre del paciente</label>
        <input type="text" id="nombrePaciente" required>
      </div>
      <div class="form-group">
        <label for="sedeHospital">Sede</label>
        <select id="sedeHospital" required>
          <option value="">-- Selecciona una sede --</option>
          <option value="Hospital Huacho">Hospital Huacho</option>
          <option value="Hospital Barranca">Hospital Barranca</option>
          <option value="Hospital Huaral">Hospital Huaral</option>
           <option value="Hospital de Alta Complejidad 'Virgen de la Puerta'">Hospital de Alta Complejidad 'Virgen de la Puerta'</option>
          <option value="Hospital Regional Docente de Trujillo">Hospital Regional Docente de Trujillo</option>
          <option value="Hospital Nacional Arzobispo Loayza">Hospital Nacional Arzobispo Loayza</option>
          <option value="Hospital Nacional Guillermo Almenara Irigoyen">Hospital Nacional Guillermo Almenara Irigoyen</option>
          <option value="Hospital Nacional Edgardo Rebagliati Martins">Hospital Nacional Edgardo Rebagliati Martins</option>
          <option value="Hospital Nacional Daniel Alcides Carrión">Hospital Nacional Daniel Alcides Carrión</option>
        </select>
      </div>
      <div class="form-group" id="grupo-estado" hidden>
        <label for="estado">Estado</label>
        <select id="estado" required>
          <option value="registrado">registrado</option>
          <option value="atendido">atendido</option>
          <option value="rechazado">rechazado</option>
        </select>
      </div>
      <button type="submit" class="btn-agendar" id="btn-guardar">Crear cita</button>
      <button type="button" class="btn-agendar btn-secundario" id="btn-cancelar" hidden>Cancelar edición</button>
    </form>
    <div id="mensajeConfirmacion"></div>
  </div>

  <main class="contenedor-tabla">
    <h2 class="titulo-seccion">Todas las citas</h2>
    <div class="tabla-scroll">
      <table>
        <caption class="solo-lectores">Listado de citas</caption>
        <thead><tr><th>Código</th><th>Asegurado</th><th>Paciente</th><th>Sede</th><th>Estado</th><th>Cliente (id)</th><th>Acciones</th></tr></thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/panel/panel.js"></script>
</body>
</html>
